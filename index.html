<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>牛马倒计时 · 拉磨进阶版</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
html,body{
    margin:0;
    height:100%;
    background:#1f1f1f;
    font-family:"Microsoft YaHei",sans-serif;
    overflow:hidden;
}
.wrap{
    position:relative;
    z-index:2;
    height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    color:#e6e6e6;
    pointer-events:none;
}
h1{letter-spacing:3px;margin-bottom:4px}
.subtitle{font-size:13px;color:#aaa;margin-bottom:18px}

.holiday-name{
    font-size:24px;
    color:#ffd700;
    margin:10px 0;
    font-weight:bold;
    text-shadow:0 0 8px rgba(255,215,0,0.5);
}
.time{font-size:40px;font-weight:bold}
.desc{margin-top:8px;font-size:15px;color:#999}

/* ===== 拉磨结构 ===== */
.mill-area{
    position:relative;
    width:360px;
    height:360px;
    margin-top:30px;
}

/* 旋转组 */
.rotator{
    position:absolute;
    left:50%;
    top:50%;
    width:0;
    height:0;
    animation: millRotate 20s linear infinite;
}

/* 石磨 */
.mill{
    position:absolute;
    left:-110px;
    top:-110px;
    width:220px;
    height:220px;
    border-radius:50%;
    background:
        radial-gradient(circle at 40% 40%, #666 0%, #444 60%, #333 100%);
    box-shadow:
        inset -8px -8px 20px rgba(0,0,0,0.6),
        inset 6px 6px 12px rgba(255,255,255,0.08),
        0 0 25px rgba(0,0,0,0.5);
}

/* 中心轴 */
.mill::after{
    content:"";
    position:absolute;
    left:50%;
    top:50%;
    width:30px;
    height:30px;
    margin:-15px;
    border-radius:50%;
    background:#222;
    box-shadow:0 0 12px rgba(0,0,0,0.9);
}

/* 横杆 */
.rod{
    position:absolute;
    left:0;
    top:-5px;
    width:170px;
    height:10px;
    background:linear-gradient(to right,#6b4c2b,#3e2a15);
    border-radius:5px;
    box-shadow:0 0 8px rgba(0,0,0,0.6);
}

/* 驴 */
.animal{
    position:absolute;
    left:50%;
    top:50%;
    width:100px;
    height:100px;
    margin:-50px;
    transform: translateX(170px);
}

/* 腿部摆动 */
.leg1,.leg3{
    transform-origin:top center;
    animation: legMove 0.6s ease-in-out infinite alternate;
}
.leg2,.leg4{
    transform-origin:top center;
    animation: legMove 0.6s ease-in-out infinite alternate-reverse;
}
@keyframes legMove{
    from{ transform:rotate(8deg); }
    to{ transform:rotate(-8deg); }
}

/* 磨盘旋转 */
@keyframes millRotate{
    from{ transform:rotate(0deg); }
    to{ transform:rotate(360deg); }
}

/* ===== 弹幕 ===== */
.bubble{
    position:absolute;
    white-space:nowrap;
    color:#e6e6e6;
    font-size:18px;
    font-weight:500;
    z-index:5;
    line-height:40px;
    height:40px;
    transform:translateY(-50%);
}
@keyframes danmuMove{
    0%{transform:translateX(100vw) translateY(-50%);}
    100%{transform:translateX(-100%) translateY(-50%);}
}

.input-box{
    position:fixed;
    bottom:18px;
    left:50%;
    transform:translateX(-50%);
    z-index:999;
    display:flex;
    gap:8px;
}
.input-box input{
    padding:10px 12px;
    width:260px;
    font-size:16px;
    border:1px solid #444;
    background:#2f2f2f;
    color:#e6e6e6;
    border-radius:4px;
}
.input-box button{
    padding:10px 20px;
    border:none;
    background:#666;
    color:#fff;
    border-radius:4px;
    cursor:pointer;
}
.input-box button:hover{background:#888}

/* 灰尘 */
canvas#dust{
    position:absolute;
    left:0;top:0;
    width:100%;height:100%;
    z-index:1;
    pointer-events:none;
}
</style>
</head>

<body>

<div class="wrap">
    <h1>🐂 牛马倒计时</h1>
    <div class="subtitle">努力不一定有结果，但一定很累</div>
    <div class="holiday-name" id="holidayName"></div>
    <div class="time" id="time"></div>
    <div class="desc" id="desc"></div>

    <div class="mill-area">
    <div class="rotator">
        <div class="mill"></div>
        <div class="rod"></div>

        <!-- 驴必须放在 rotator 里面 -->
        <svg class="animal" viewBox="0 0 120 100">
            <ellipse cx="60" cy="55" rx="32" ry="20" fill="#777"/>
            <ellipse cx="100" cy="45" rx="14" ry="12" fill="#777"/>
            <polygon points="95,30 100,15 105,30" fill="#666"/>
            <polygon points="105,30 110,18 115,32" fill="#666"/>
            <circle cx="105" cy="43" r="2" fill="#222"/>
            <rect class="leg1" x="38" y="70" width="6" height="22" fill="#555"/>
            <rect class="leg2" x="55" y="70" width="6" height="22" fill="#555"/>
            <rect class="leg3" x="72" y="70" width="6" height="22" fill="#555"/>
            <rect class="leg4" x="89" y="70" width="6" height="22" fill="#555"/>
            <line x1="28" y1="55" x2="15" y2="48" stroke="#555" stroke-width="3"/>
        </svg>

    </div>
</div>

<div class="input-box">
    <input id="danmuInput" placeholder="发一句牛马宣言…" autocomplete="off">
    <button onclick="sendDanmu()">发射</button>
</div>

<canvas id="dust"></canvas>

<script>
/******** 倒计时 ********/
const holidays2026 = [
    { name: "春节", date: "2026-02-17T18:15:00" },
    { name: "清明节", date: "2026-04-05T18:15:00" },
    { name: "劳动节", date: "2026-05-01T18:15:00" },
    { name: "端午节", date: "2026-06-19T18:15:00" },
    { name: "中秋节", date: "2026-09-26T18:15:00" },
    { name: "国庆节", date: "2026-10-01T18:15:00" }
];

function getNextHoliday(){
    const now=new Date();
    const future=holidays2026.filter(h=>new Date(h.date)>now);
    return future.length?future[0]:{name:"元旦",date:"2027-01-01T18:15:00"};
}

const nextHoliday=getNextHoliday();
const targetDate=new Date(nextHoliday.date);
document.getElementById('holidayName').innerText=`🎯 目标假期：${nextHoliday.name}`;

function update(){
    const diff=targetDate-new Date();
    if(diff<=0){
        document.getElementById('time').innerText="已完成";
        return;
    }
    const d=Math.floor(diff/86400000);
    const h=Math.floor(diff/3600000)%24;
    const m=Math.floor(diff/60000)%60;
    const s=Math.floor(diff/1000)%60;
    document.getElementById('time').innerText=
        d+" 天 "+
        String(h).padStart(2,'0')+":"+
        String(m).padStart(2,'0')+":"+
        String(s).padStart(2,'0');
    document.getElementById('desc').innerText="距离假期还有";
}
setInterval(update,1000);update();

/******** 简化弹幕 ********/
function sendDanmu(){
    if(!danmuInput.value.trim()) return;
    spawnDanmu(danmuInput.value);
    danmuInput.value="";
}
function spawnDanmu(text){
    const t=document.createElement("div");
    t.className="bubble";
    t.innerText=text;
    t.style.top=Math.random()*window.innerHeight+"px";
    t.style.animation="danmuMove 18s linear infinite";
    document.body.appendChild(t);
}

/******** 灰尘 ********/
const c=document.getElementById('dust');
const ctx=c.getContext('2d');
c.width=innerWidth;
c.height=innerHeight;
let dusts=[];
for(let i=0;i<100;i++){
    dusts.push({x:Math.random()*c.width,y:Math.random()*c.height,r:Math.random()*2+0.5,v:Math.random()*0.3});
}
function animate(){
    ctx.clearRect(0,0,c.width,c.height);
    ctx.fillStyle='rgba(180,180,180,0.25)';
    dusts.forEach(p=>{
        p.x+=p.v;if(p.x>c.width)p.x=0;
        ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();
    });
    requestAnimationFrame(animate);
}
animate();
</script>

</body>
</html>
